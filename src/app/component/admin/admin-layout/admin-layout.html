<div class="flex min-h-screen bg-[#050505] text-white">
    <aside class="w-72 bg-[#0a0a0a] border-r border-gray-900 flex flex-col fixed h-full z-50">
        <div class="p-8">
            <h1 class="text-2xl font-black italic tracking-tighter">
                LANKA<span class="text-green-500">RENT</span>
            </h1>
        </div>

        <nav class="flex-1 px-4 space-y-2 mt-8">
            <a routerLink="/admin/dashboard" routerLinkActive="bg-green-600 text-black shadow-lg shadow-green-900/20"
                class="flex items-center gap-4 p-4 rounded-2xl transition font-bold text-gray-400 hover:bg-white/5">
                <span class="text-xl">.</span> Dashboard
            </a>
            <a routerLink="/admin/manage-cars" routerLinkActive="bg-green-600 text-black shadow-lg shadow-green-900/20"
                class="flex items-center gap-4 p-4 rounded-2xl transition font-bold text-gray-400 hover:bg-white/5">
                <span class="text-xl">.</span> Manage Cars
            </a>
            <a routerLink="/admin/manage-drivers" routerLinkActive="bg-green-600 text-black"
                class="flex items-center gap-4 p-4 rounded-2xl transition font-bold text-gray-400 hover:bg-white/5">
                <span class="text-xl">.</span> Manage Drivers
            </a>
            <a routerLink="/admin/all-bookings" routerLinkActive="bg-green-600 text-black"
                class="flex items-center gap-4 p-4 rounded-2xl transition font-bold text-gray-400 hover:bg-white/5">
                <span class="text-xl">.</span> Bookings
            </a>
            <a routerLink="/admin/manage-users" routerLinkActive="bg-green-600 text-black"
                class="flex items-center gap-4 p-4 rounded-2xl transition font-bold text-gray-400 hover:bg-white/5">
                <span class="text-xl">.</span> Manage Users
            </a>
        </nav>

        <div class="p-6 border-t border-gray-900">
            <button (click)="onLogout()" class="w-full text-red-500 font-black uppercase text-[10px] tracking-widest p-4 rounded-2xl hover:bg-red-500/10 transition border border-transparent hover:border-red-500/20">
                Logout System
            </button>
        </div>
    </aside>

    <main class="flex-1 ml-72">
        <header class="h-20 border-b border-gray-900 bg-[#0a0a0a]/80 backdrop-blur-md flex items-center justify-end px-10 sticky top-0 z-40">
            <div class="flex items-center gap-8">
                
                <a routerLink="/admin/messages" class="relative group p-2 hover:bg-gray-900 rounded-xl transition duration-300">
                    <span class="text-2xl text-gray-400 group-hover:text-green-500 transition">✉</span>
                    
                    <span *ngIf="pendingMessagesCount > 0" 
                        class="absolute -top-1 -right-1 bg-red-600 text-white text-[9px] font-black w-5 h-5 flex items-center justify-center rounded-full border-2 border-[#0a0a0a] animate-bounce">
                        {{ pendingMessagesCount }}
                    </span>
                </a>

                <div class="flex items-center gap-4 border-l border-gray-800 pl-8">
                    <div class="text-right">
                        <p class="text-xs font-black uppercase tracking-widest text-green-500">Administrator</p>
                        <p class="text-sm font-bold text-white">{{ adminName }}</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-green-600 to-emerald-400 flex items-center justify-center font-black text-black text-sm shadow-lg shadow-green-900/20">
                        {{ adminName?.charAt(0) }}
                    </div>
                </div>

            </div>
        </header>

        <div class="p-10">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
