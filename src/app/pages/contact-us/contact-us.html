<div class="bg-[#0a0a0a] min-h-screen text-white pb-20 pt-10">
  <div class="container mx-auto px-6">
    <div class="text-center mb-16">
      <h1 class="text-5xl font-extrabold mb-4 text-green-500 italic uppercase tracking-tighter">Get In <span class="text-white">Touch</span></h1>
      <p class="text-gray-500 font-medium">Have questions? We are here to help you 24/7.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-start">
      <div class="space-y-8">
        <div class="bg-[#111] p-10 rounded-[2.5rem] border border-gray-900 shadow-2xl">
          <h2 class="text-2xl font-black mb-8 text-white uppercase tracking-widest">Contact <span class="text-green-500">Info</span></h2>
          <div class="space-y-8">
            <div class="flex items-center space-x-6 group">
              <div class="bg-green-600/10 p-4 rounded-2xl text-green-500 group-hover:bg-green-600 group-hover:text-black transition duration-500 text-xl">📞</div>
              <span class="text-xl font-bold tracking-tight">0759770013</span>
            </div>
            <div class="flex items-center space-x-6 group">
              <div class="bg-green-600/10 p-4 rounded-2xl text-green-500 group-hover:bg-green-600 group-hover:text-black transition duration-500 text-xl">📍</div>
              <span class="text-gray-400 font-medium leading-relaxed">Panadura, Western Province, Sri Lanka</span>
            </div>
          </div>
        </div>
      </div>

      <form [formGroup]="contactForm" (ngSubmit)="onSendMessage()" class="bg-[#111] p-12 rounded-[2.5rem] border border-gray-900 shadow-2xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          <div>
            <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3">Your Full Name</label>
            <input type="text" formControlName="customerName" class="w-full bg-black border border-gray-800 rounded-2xl px-6 py-4 focus:outline-none focus:border-green-500 transition text-white text-sm" placeholder="e.g. Kaveesha Sithum">
          </div>
          <div>
            <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3">Email Address</label>
            <input type="email" formControlName="email" class="w-full bg-black border border-gray-800 rounded-2xl px-6 py-4 focus:outline-none focus:border-green-500 transition text-white text-sm" placeholder="name@example.com">
          </div>
        </div>
        <div class="mb-8">
          <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3">Your Message</label>
          <textarea formControlName="message" rows="5" class="w-full bg-black border border-gray-800 rounded-2xl px-6 py-4 focus:outline-none focus:border-green-500 transition text-white text-sm leading-relaxed" placeholder="Tell us how we can help you..."></textarea>
        </div>
        <button type="submit" [disabled]="contactForm.invalid" class="w-full bg-green-600 hover:bg-green-500 disabled:opacity-20 text-black font-black py-5 rounded-2xl uppercase tracking-[0.2em] transition duration-500 shadow-xl shadow-green-900/20">
          Send Message Now
        </button>
      </form>
    </div>
  </div>
</div>
