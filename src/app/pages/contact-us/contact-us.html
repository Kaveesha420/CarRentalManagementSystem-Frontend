<div class="bg-[#0a0a0a] min-h-screen text-white pb-20 pt-10">
  <div class="container mx-auto px-6">
    <div class="text-center mb-16">
      <h1 class="text-5xl font-extrabold mb-4 text-green-500">Get In Touch</h1>
      <p class="text-gray-400">Have questions? We are here to help you 24/7.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-start">
      <div class="space-y-8">
        <div class="bg-[#141414] p-8 rounded-2xl border border-gray-800">
          <h2 class="text-2xl font-bold mb-6 text-green-400 uppercase tracking-tighter">Contact Information</h2>
          <div class="space-y-6">
            <div class="flex items-center space-x-4">
              <div class="bg-green-600/20 p-3 rounded-full text-green-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
              </div>
              <span class="text-xl font-bold">0759770013</span>
            </div>
            <div class="flex items-center space-x-4">
              <div class="bg-green-600/20 p-3 rounded-full text-green-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              </div>
              <span class="text-gray-300">Panadura, Western Province, Sri Lanka</span>
            </div>
          </div>
        </div>
      </div>

      <form class="bg-[#141414] p-10 rounded-2xl border border-gray-800 shadow-xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div>
            <label class="block text-sm font-medium text-gray-500 mb-2">Your Name</label>
            <input type="text" class="w-full bg-black border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500 transition text-white" placeholder="Sithum">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-500 mb-2">Email Address</label>
            <input type="email" class="w-full bg-black border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500 transition text-white" placeholder="name@example.com">
          </div>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-500 mb-2">Message</label>
          <textarea rows="4" class="w-full bg-black border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500 transition text-white" placeholder="How can we help you?"></textarea>
        </div>
        <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-black font-black py-4 rounded-lg uppercase tracking-widest transition duration-300 shadow-[0_0_20px_rgba(34,197,94,0.3)]">
          Send Message
        </button>
      </form>
    </div>
  </div>
</div>
