<div class="bg-[#0a0a0a] min-h-screen text-white pt-10 pb-20">
  <div class="container mx-auto px-6">
    
    <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
      <div>
        <h2 class="text-4xl font-black uppercase tracking-tighter leading-none">
          Our <span class="text-green-500">Vehicles</span>
        </h2>
        <p class="text-gray-500 mt-3 text-sm tracking-wide">
          Select from our wide range of premium vehicles. Showing page {{ currentPage + 1 }} of {{ totalPages }}
        </p>
      </div>

      </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <app-vehicle-item *ngFor="let v of vehicleList" [vehicle]="v"></app-vehicle-item>
    </div>

    <div *ngIf="totalPages > 0" class="mt-20 flex justify-center items-center gap-3">
      
      <button 
        [disabled]="currentPage === 0"
        (click)="getVehicle(currentPage - 1)"
        class="p-4 rounded-2xl border border-gray-800 bg-[#111] hover:border-green-500 disabled:opacity-20 disabled:cursor-not-allowed transition-all duration-300">
        <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>

      <div class="flex gap-2">
        <button 
          *ngFor="let p of pagesArray" 
          (click)="getVehicle(p)"
          [class]="p === currentPage 
            ? 'bg-green-600 text-black border-green-600 scale-110 shadow-[0_0_15px_rgba(34,197,94,0.3)]' 
            : 'bg-transparent text-gray-400 border-gray-800 hover:border-green-500 hover:text-white'"
          class="w-12 h-12 rounded-2xl border font-black text-sm transition-all duration-300">
          {{ p + 1 }}
        </button>
      </div>

      <button 
        [disabled]="currentPage === totalPages - 1"
        (click)="getVehicle(currentPage + 1)"
        class="p-4 rounded-2xl border border-gray-800 bg-[#111] hover:border-green-500 disabled:opacity-20 disabled:cursor-not-allowed transition-all duration-300">
        <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

    </div>

    <div *ngIf="vehicleList.length === 0" class="mt-20 text-center">
      <p class="text-gray-600 italic">No vehicles found on this page.</p>
    </div>

  </div>
</div>
