<div class="bg-[#0a0a0a] min-h-screen text-white pt-10 pb-20">
  <div class="container mx-auto px-6 max-w-5xl">
    <div class="bg-[#141414] rounded-3xl border border-gray-800 overflow-hidden shadow-2xl flex flex-col md:flex-row">
      
      <div class="p-10 md:w-2/3 border-r border-gray-800">
        <h2 class="text-3xl font-black mb-8 uppercase tracking-tighter">Complete Your <span class="text-green-500">Booking</span></h2>
        
        <form class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Pickup Date</label>
              <input type="date" class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 focus:border-green-500 outline-none transition">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Return Date</label>
              <input type="date" class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 focus:border-green-500 outline-none transition">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Pickup Location</label>
            <select class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 focus:border-green-500 outline-none transition">
              <option>Colombo (Main Branch)</option>
              <option>Panadura</option>
              <option>Bandaranaike Int. Airport (BIA)</option>
            </select>
          </div>

          <div class="flex items-center space-x-3 p-4 bg-green-600/5 border border-green-600/20 rounded-xl">
            <input type="checkbox" id="driver" class="w-5 h-5 accent-green-600">
            <label for="driver" class="text-sm font-bold text-gray-300">I need a professional driver (+ LKR 3,000/day)</label>
          </div>

          <button type="button" class="w-full bg-green-600 hover:bg-green-500 text-black font-black py-5 rounded-2xl uppercase tracking-[0.2em] transition shadow-lg shadow-green-900/20">
            Confirm Reservation
          </button>
        </form>
      </div>

      <div class="p-10 md:w-1/3 bg-[#1a1a1a]">
        <h3 class="text-xl font-bold mb-6 border-b border-gray-800 pb-4">Summary</h3>
        <div class="space-y-4">
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">Vehicle</span>
            <span class="text-white font-bold">Porsche 911</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">Rate</span>
            <span class="text-white">LKR 45,000/day</span>
          </div>
          <div class="flex justify-between text-sm border-t border-gray-800 pt-4">
            <span class="text-gray-500 font-bold uppercase">Total</span>
            <span class="text-green-500 text-2xl font-black">LKR 45,000</span>
          </div>
        </div>
        <div class="mt-10 p-4 rounded-xl border border-dashed border-gray-700">
          <p class="text-[10px] text-gray-500 text-center leading-relaxed">
            By confirming, you agree to LankaRent's terms of service and insurance policies.
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
