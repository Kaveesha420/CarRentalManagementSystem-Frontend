<div class="bg-[#0a0a0a] min-h-screen text-white pt-10 pb-20">
  <div class="container mx-auto px-6 max-w-5xl">
    
    <div *ngIf="!vehicle" class="text-center py-20">
      <p class="text-gray-500 animate-pulse font-black uppercase tracking-widest">Initialising Fleet Data...</p>
    </div>

    <div *ngIf="vehicle" class="bg-[#141414] rounded-[2.5rem] border border-gray-900 overflow-hidden shadow-2xl flex flex-col md:flex-row">
      
      <div class="p-10 md:w-2/3 border-r border-gray-800">
        <h2 class="text-3xl font-black mb-8 uppercase tracking-tighter">Reservation <span class="text-green-500">Details</span></h2>
        
        <form [formGroup]="bookingForm" (ngSubmit)="confirmBooking()" class="space-y-8">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
              <label class="block text-[10px] font-black text-gray-500 uppercase mb-3 tracking-widest">Pickup Schedule</label>
              <input type="date" formControlName="pickupDate" class="w-full bg-black border border-gray-800 rounded-2xl px-6 py-4 focus:border-green-500 outline-none transition">
            </div>
            <div>
              <label class="block text-[10px] font-black text-gray-500 uppercase mb-3 tracking-widest">Return Schedule</label>
              <input type="date" formControlName="returnDate" class="w-full bg-black border border-gray-800 rounded-2xl px-6 py-4 focus:border-green-500 outline-none transition">
            </div>
          </div>

          <div class="p-6 bg-green-600/5 border border-green-600/20 rounded-3xl flex items-center gap-4">
            <input type="checkbox" id="drv" formControlName="withDriver" class="w-6 h-6 accent-green-600">
            <label for="drv" class="text-sm font-bold text-gray-300">Request a Professional Driver <span class="text-green-500 ml-2">(+ LKR 3,000/day)</span></label>
          </div>

          <button type="submit" [disabled]="bookingForm.invalid || totalAmount <= 0" 
            class="w-full bg-green-600 hover:bg-green-500 disabled:opacity-10 text-black font-black py-5 rounded-2xl uppercase tracking-[0.2em] transition-all duration-500 shadow-xl shadow-green-900/10">
            Confirm & Reserve
          </button>
        </form>
      </div>

      <div class="p-10 md:w-1/3 bg-[#1a1a1a]">
        <h3 class="text-xl font-bold mb-8 border-b border-gray-800 pb-4 uppercase">Invoice Summary</h3>
        
        <div class="space-y-6">
          <div class="bg-black/40 p-5 rounded-2xl border border-gray-800">
            <p class="text-[9px] font-black text-gray-600 uppercase mb-1">Model Selected</p>
            <h4 class="text-white font-bold leading-tight">{{ vehicle.brand }} {{ vehicle.model }}</h4>
          </div>

          <div class="space-y-4 px-2">
            <div class="flex justify-between text-xs">
              <span class="text-gray-500 uppercase">Rate</span>
              <span>LKR {{ vehicle.pricePerDay | number }}</span>
            </div>
            <div class="flex justify-between text-xs">
              <span class="text-gray-500 uppercase">Period</span>
              <span class="text-green-500 font-bold">{{ totalDays }} Days</span>
            </div>
            <div *ngIf="bookingForm.value.withDriver" class="flex justify-between text-xs">
              <span class="text-gray-500 uppercase">Driver</span>
              <span class="text-green-500">LKR {{ (totalDays * 3000) | number }}</span>
            </div>
          </div>

          <div class="pt-8 border-t border-gray-800 flex justify-between items-end">
            <span class="text-gray-500 font-black uppercase text-[10px]">Grand Total</span>
            <span class="text-green-500 text-3xl font-black">LKR {{ totalAmount | number }}</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
