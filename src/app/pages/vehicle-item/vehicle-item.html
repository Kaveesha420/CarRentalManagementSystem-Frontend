<div class="bg-[#141414] rounded-3xl overflow-hidden border border-gray-800 group hover:border-green-600/50 transition duration-500">
  <div class="h-56 bg-gray-900 relative overflow-hidden">
    <img [src]="'assets/' + vehicle.imagePath" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
    
    <div [class.bg-green-600]="vehicle.status === 'AVAILABLE'" 
         [class.bg-red-600]="vehicle.status !== 'AVAILABLE'"
         class="absolute top-4 right-4 text-black text-[10px] font-black px-3 py-1 rounded-full uppercase">
      {{ vehicle.status }}
    </div>
  </div>
  
  <div class="p-8">
    <div class="flex justify-between items-start mb-4">
      <div>
        <h3 class="text-2xl font-bold">{{ vehicle.model }}</h3>
        <p class="text-gray-500 text-xs italic uppercase tracking-widest mt-1">{{ vehicle.brand }}</p>
        <div class="mt-4 space-y-1">
          <p class="text-gray-400 text-[10px] uppercase tracking-widest">⛽ {{ vehicle.fuelType }}</p>
          <p class="text-gray-400 text-[10px] uppercase tracking-widest">👥 {{ vehicle.seatingCapacity }} Seats</p>
        </div>
      </div>
      <div class="text-right">
        <span class="text-green-500 font-bold text-xl">LKR {{ vehicle.pricePerDay | number }}</span>
        <p class="text-[10px] text-gray-600 uppercase">per day</p>
      </div>
    </div>
    
    <button [routerLink]="['/booking', vehicle.id]" class="w-full bg-white hover:bg-green-500 text-black font-black py-4 rounded-xl uppercase tracking-widest transition duration-300">
      Rent Now
    </button>
  </div>
</div>
