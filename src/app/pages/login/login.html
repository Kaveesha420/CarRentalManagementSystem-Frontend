<div class="min-h-screen bg-[#0a0a0a] flex items-center justify-center px-6">
  <div class="max-w-md w-full bg-[#141414] border border-gray-800 p-10 rounded-3xl shadow-2xl">
    <h2 class="text-3xl font-black text-white mb-2 uppercase tracking-tighter italic">Welcome <span class="text-green-500">Back</span></h2>
    <p class="text-gray-500 text-sm mb-8">Please enter your credentials to login.</p>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Username</label>
        <input type="text" name="username" [(ngModel)]="loginData.username" required
               class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 text-white focus:border-green-500 outline-none transition" placeholder="Username">
      </div>
      
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Password</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="loginData.password" required
                 class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 pr-12 text-white focus:border-green-500 outline-none transition" placeholder="••••••••">
          
          <button type="button" (click)="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-green-500 transition">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.822 7.822L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="!loginForm.valid" 
              class="w-full bg-white hover:bg-green-500 text-black font-black py-4 rounded-xl uppercase tracking-widest transition mt-4 disabled:opacity-20">
        Login Now
      </button>
    </form>
    </div>
</div>
