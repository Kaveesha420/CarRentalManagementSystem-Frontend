<div class="min-h-screen bg-[#0a0a0a] flex items-center justify-center px-6">
  <div class="max-w-md w-full bg-[#141414] border border-gray-800 p-10 rounded-3xl shadow-2xl">
    <h2 class="text-3xl font-black text-white mb-2 uppercase tracking-tighter italic">Welcome <span class="text-green-500">Back</span></h2>
    <p class="text-gray-500 text-sm mb-8">Please enter your credentials to login.</p>

    <form class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Username</label>
        <input type="text" name="username" class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 text-white focus:border-green-500 outline-none transition" placeholder="Username">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Password</label>
        <input type="password" name="password" class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 text-white focus:border-green-500 outline-none transition" placeholder="••••••••">
      </div>

      <button type="submit" class="w-full bg-white hover:bg-green-500 text-black font-black py-4 rounded-xl uppercase tracking-widest transition mt-4">
        Login Now
      </button>
    </form>

    <div class="mt-10 pt-6 border-t border-gray-900 flex justify-between items-center">
        <a routerLink="/register" class="text-xs text-gray-500 hover:text-green-500 transition">Don't have an account?</a>
        <a href="#" class="text-xs text-gray-500 hover:text-green-500 transition">Forgot Password?</a>
    </div>
  </div>
</div>
