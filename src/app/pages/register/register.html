<div class="min-h-screen bg-[#0a0a0a] flex items-center justify-center px-6">
  <div class="max-w-md w-full bg-[#141414] border border-gray-800 p-10 rounded-3xl shadow-2xl">
    <h2 class="text-3xl font-black text-white mb-2 uppercase tracking-tighter">Join <span class="text-green-500">LankaRent</span></h2>
    <p class="text-gray-500 text-sm mb-8">Create an account to start booking luxury rides.</p>

    <form class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Username</label>
        <input type="text" name="username" class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 text-white focus:border-green-500 outline-none transition" placeholder="johndoe">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Email Address</label>
        <input type="email" name="email" class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 text-white focus:border-green-500 outline-none transition" placeholder="name@example.com">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Password</label>
        <input type="password" name="password" class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 text-white focus:border-green-500 outline-none transition" placeholder="••••••••">
      </div>

      <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-black font-black py-4 rounded-xl uppercase tracking-widest transition mt-4 shadow-lg shadow-green-900/20">
        Create Account
      </button>
    </form>

    <p class="text-center text-gray-500 text-xs mt-8 uppercase tracking-widest">
      Already have an account? <a routerLink="/login" class="text-green-500 font-bold hover:underline cursor-pointer">Login</a>
    </p>
  </div>
</div>
