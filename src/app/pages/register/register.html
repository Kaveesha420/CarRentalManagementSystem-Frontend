<div class="min-h-screen bg-[#0a0a0a] flex items-center justify-center px-6 py-12">
    <div class="max-w-2xl w-full bg-[#141414] border border-gray-800 p-10 rounded-3xl shadow-2xl">
      
      <div class="text-center">
          <h2 class="text-3xl font-black text-white mb-2 uppercase tracking-tighter italic">Create <span class="text-green-500">Account</span></h2>
          <p class="text-gray-500 text-sm mb-8">Join with us to experience the best car rental service.</p>
      </div>

      <form (ngSubmit)="onRegister()" #regForm="ngForm" class="space-y-5">
        
      
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-2 tracking-widest">Username</label>
            <input type="text" name="username" [(ngModel)]="userData.username" required 
                   class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 text-white focus:border-green-500 outline-none transition" placeholder="johndoe">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-2 tracking-widest">Full Name</label>
            <input type="text" name="name" [(ngModel)]="userData.name" required 
                   class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 text-white focus:border-green-500 outline-none transition" placeholder="John Doe">
          </div>
        </div>

    
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-2 tracking-widest">Email Address</label>
          <input type="email" name="email" [(ngModel)]="userData.email" required 
                 class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 text-white focus:border-green-500 outline-none transition" placeholder="example@mail.com">
        </div>

      
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-2 tracking-widest">Resident Address</label>
          <input type="text" name="address" [(ngModel)]="userData.address" required 
                 class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 text-white focus:border-green-500 outline-none transition" placeholder="Your Address Here">
        </div>

  
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-2 tracking-widest">NIC Number</label>
            <input type="text" name="nic" [(ngModel)]="userData.nic" required 
                   class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 text-white focus:border-green-500 outline-none transition" placeholder="19XXXXXXXXXX">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-2 tracking-widest">Contact Number</label>
            <input type="text" name="contactNo" [(ngModel)]="userData.contactNo" required 
                   class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 text-white focus:border-green-500 outline-none transition" placeholder="07XXXXXXXX">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-2 tracking-widest">Password</label>
          <div class="relative">
            <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="userData.password" required 
                   class="w-full bg-black border border-gray-800 rounded-xl px-4 py-4 pr-12 text-white focus:border-green-500 outline-none transition" placeholder="••••••••">
            
            <button type="button" (click)="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-green-500 transition">
              
            </button>
          </div>
        </div>

        <button type="submit" [disabled]="!regForm.valid"
                class="w-full bg-green-600 hover:bg-green-500 text-black font-black py-4 rounded-xl uppercase tracking-widest transition duration-300 mt-4 shadow-lg shadow-green-900/20 disabled:opacity-20">
          Complete Registration
        </button>

      </form>
    </div>
</div>
